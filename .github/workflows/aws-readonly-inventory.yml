name: AWS Read-only Inventory

run-name: AWS read-only inventory · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Inspect existing Connect sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_PAGER: ""
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONNECT_INSTANCE_ALIAS: ${{ vars.AWS_CONNECT_INSTANCE_ALIAS }}

    steps:
      - name: Enforce manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Validate non-secret configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${AWS_ACCOUNT_ID}" != ""
          test "${AWS_REGION}" != ""
          test "${CONNECT_INSTANCE_ALIAS}" != ""
          test "${{ vars.AWS_ROLE_ARN }}" != ""
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]]
          [[ "${CONNECT_INSTANCE_ALIAS}" =~ ^[A-Za-z0-9_-]{1,45}$ ]]
          echo "::add-mask::${AWS_ACCOUNT_ID}"

      - name: Check out inventory script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/aws-readonly-inventory.sh
          sparse-checkout-cone-mode: false

      - name: Assume dedicated read-only AWS role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: stockguard-readonly-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3

      - name: Collect sanitized Connect inventory
        shell: bash
        run: bash scripts/aws-readonly-inventory.sh
