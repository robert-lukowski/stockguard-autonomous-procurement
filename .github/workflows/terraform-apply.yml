name: Terraform Apply

run-name: Terraform APPLY · requested by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm you intend to change AWS resources'
        required: true
        type: string
      simulator_enabled:
        description: 'Keep the synthetic supplier armed so it can answer qualification calls'
        required: false
        default: true
        type: boolean
      enable_call_recording:
        description: 'Include private automated-interaction recording in the reviewed plan'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: aws-qualification

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_connect_instance_id: ${{ secrets.AWS_CONNECT_INSTANCE_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_simulator_enabled: ${{ inputs.simulator_enabled }}
      TF_VAR_enable_call_recording: ${{ inputs.enable_call_recording }}

    steps:
      - name: Verify explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "APPLY" || {
            echo "::error::Confirmation input must be exactly APPLY"
            exit 1
          }

      - name: Enforce main branch and repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify the code that is about to be deployed
        run: |
          set -euo pipefail
          npm run lint
          npm test

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stockguard-apply-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Terraform init with remote state
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply the saved plan
        working-directory: infrastructure/terraform
        run: terraform apply -no-color -auto-approve tfplan

      - name: Verify the deployed runtime (read-only)
        working-directory: infrastructure/terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ secrets.AWS_CONNECT_INSTANCE_ID }}
          SIMULATOR: ${{ inputs.simulator_enabled }}
          RECORDING: ${{ inputs.enable_call_recording }}
        run: |
          set -euo pipefail
          terraform output -json > tf-outputs.json
          ../../scripts/qualification/verifyAwsRuntime.sh \
            --outputs tf-outputs.json \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --expect-simulator "$SIMULATOR" \
            --expect-recording "$RECORDING"

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Terraform apply completed'
            echo ''
            echo "simulator_enabled: \`${{ inputs.simulator_enabled }}\`"
            echo "enable_call_recording: \`${{ inputs.enable_call_recording }}\`"
            echo ''
            echo 'Apply used the exact saved tfplan produced in this job.'
          } >> "$GITHUB_STEP_SUMMARY"
