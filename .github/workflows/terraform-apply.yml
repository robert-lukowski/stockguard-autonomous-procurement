name: Terraform Apply

run-name: Terraform APPLY · requested by ${{ github.actor }}

# ---------------------------------------------------------------------------
# THIS WORKFLOW HAS NEVER BEEN RUN.
#
# It exists so that a future deployment is reviewable as code rather than
# improvised. Every automatic trigger is deliberately absent: there is no
# push, no pull_request and no schedule. The only way to start it is a human
# choosing workflow_dispatch on main, and then a second human approving the
# protected environment.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm you intend to change AWS resources'
        required: true
        type: string
      simulator_enabled:
        description: 'Arm the synthetic supplier so it answers calls (keep false until the qualification call)'
        required: false
        default: false
        type: boolean
      enable_call_recording:
        description: 'Create the recording bucket and attach it to Connect (keep false until an existing CALL_RECORDINGS config is ruled out)'
        required: false
        default: false
        type: boolean
      recovery_mode:
        description: 'Allow the reviewed one-time simulator Lambda replacement recovery'
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

# Never two applies at once, and never cancel one midway: a half-applied
# Terraform run is worse than a slow one.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Requires a reviewer configured on the environment. The deploy role's
    # trust policy is bound to this environment's OIDC subject, so without
    # approval no AWS credential can be issued at all - the gate is enforced
    # by IAM, not only by GitHub.
    environment:
      name: aws-qualification

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      # Secrets, so GitHub masks them from first use.
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_connect_instance_id: ${{ secrets.AWS_CONNECT_INSTANCE_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      # Both default to false. Arming the simulator or attaching a recording
      # configuration is always a conscious choice made at dispatch time,
      # never something an apply does on its own.
      TF_VAR_simulator_enabled: ${{ inputs.simulator_enabled }}
      TF_VAR_enable_call_recording: ${{ inputs.enable_call_recording }}

    steps:
      - name: Verify explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "APPLY" || {
            echo "::error::Confirmation input must be exactly APPLY"
            exit 1
          }

      # Chooses the safety policy for this apply, and refuses before any AWS
      # credential is requested if the requested toggle combination has no
      # reviewed policy. There is no path that applies without a policy.
      - name: Select apply policy mode
        shell: bash
        env:
          SIMULATOR: ${{ inputs.simulator_enabled }}
          RECORDING: ${{ inputs.enable_call_recording }}
          RECOVERY: ${{ inputs.recovery_mode }}
        run: |
          set -euo pipefail
          if [ "$RECORDING" != "false" ]; then
            echo "::error::enable_call_recording=${RECORDING} has no reviewed apply policy."
            echo "::error::Attaching a CALL_RECORDINGS configuration replaces whatever the Connect instance already has, and that baseline has not been captured. Capture it first."
            exit 1
          fi
          case "$RECOVERY" in
            false|true) ;;
            *) echo "::error::recovery_mode must be true or false, got '${RECOVERY}'"; exit 1 ;;
          esac
          if [ "$RECOVERY" = "true" ]; then
            if [ "$SIMULATOR" != "false" ]; then
              echo "::error::recovery_mode requires simulator_enabled=false"
              exit 1
            fi
            MODE=recovery
          else
            case "$SIMULATOR" in
              false) MODE=initial ;;
              true)  MODE=qualification ;;
              *) echo "::error::simulator_enabled must be true or false, got '${SIMULATOR}'"; exit 1 ;;
            esac
          fi
          echo "PLAN_POLICY_MODE=${MODE}" >> "$GITHUB_ENV"
          echo "::notice::Apply safety policy: ${MODE}"

      - name: Enforce main branch and repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify the code that is about to be deployed
        run: |
          set -euo pipefail
          npm run lint
          npm test

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stockguard-apply-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      # Same partial backend as the plan workflow, so both operate on one
      # state object. Values come from GitHub configuration, never the repo.
      - name: Terraform init with remote state
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      # A fresh plan is produced immediately before applying, and apply runs
      # that exact saved plan file. Nothing can drift between the two.
      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -no-color -out=tfplan

      - name: Render the plan as JSON
        working-directory: infrastructure/terraform
        run: terraform show -json tfplan > tfplan.json

      # The same gate the plan workflow runs, applied to THIS plan. The plan a
      # human reviewed earlier and the plan about to be applied are different
      # documents: state or the account may have moved in between. Only the
      # second one can be trusted, so only the second one decides.
      - name: Enforce the plan safety policy
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          node ../../scripts/terraform/assertQualificationPolicy.mjs \
            --plan tfplan.json \
            --mode "$PLAN_POLICY_MODE" \
            --report plan-policy-report.json | tee policy.txt

      - name: Upload the plan policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-policy-report
          path: infrastructure/terraform/plan-policy-report.json
          if-no-files-found: warn
          retention-days: 7

      # Unreachable unless the gate above exited zero.
      - name: Terraform apply the saved plan
        working-directory: infrastructure/terraform
        run: terraform apply -no-color -auto-approve tfplan

      # Read-only. Confirms the apply produced the intended runtime and nothing
      # else. It never invokes the Lambda, drives Lex, or touches Connect.
      - name: Verify the deployed runtime (read-only)
        working-directory: infrastructure/terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ secrets.AWS_CONNECT_INSTANCE_ID }}
          SIMULATOR: ${{ inputs.simulator_enabled }}
        run: |
          set -euo pipefail
          terraform output -json > tf-outputs.json
          ../../scripts/qualification/verifyAwsRuntime.sh \
            --outputs tf-outputs.json \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --expect-simulator "$SIMULATOR" \
            --expect-recording false

      - name: Remaining manual steps
        shell: bash
        run: |
          {
            echo '### Still required, manually'
            echo 'Full sequence, including rollback: `docs/aws-qualification-post-apply-runbook.md`'
            echo ''
            echo '1. Capture the CURRENT inbound flow of the existing +1 number in the Connect console, before changing anything'
            echo '2. `aws connect associate-bot --lex-v2-bot ...` (see terraform output; provider gap #30869) - required BEFORE the apply that creates the contact flow'
            echo '3. Assign the existing +1 number to the new contact flow ONLY when the qualification stage is approved'
            echo '4. Set `simulator_enabled = true` only immediately before a controlled qualification call'
          } >> "$GITHUB_STEP_SUMMARY"
