name: Terraform Plan

run-name: Terraform plan · ${{ github.ref_name }}

# Two jobs, deliberately separated.
#
#   validate — runs on every PR, holds NO environment and NO AWS credential.
#   plan     — manual only, bound to the aws-qualification environment, which
#              is what the deploy role's OIDC trust policy actually requires.
#
# Splitting them is not cosmetic. The role trusts the subject
# `...:environment:aws-qualification`; a job without that environment presents
# a `:ref:` subject instead and AssumeRoleWithWebIdentity fails. Keeping the
# two apart also means PR-triggered code never has a deployment role at all.
#
# Neither job ever applies.
on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      simulator_enabled:
        description: 'Arm the synthetic supplier so it answers calls (keep false until the qualification call)'
        required: false
        default: false
        type: boolean
      enable_call_recording:
        description: 'Create the recording bucket and attach it to Connect (keep false until an existing CALL_RECORDINGS config is ruled out)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — credential-free validation.
  # ---------------------------------------------------------------------------
  validate:
    name: fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No `environment:` and no id-token permission: this job cannot obtain an
    # AWS credential even by accident.
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Enforce repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The bundle is gitignored and rebuilt here, so validation covers exactly
      # what this commit produces rather than a stale artifact.
      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      # -backend=false: no bucket, no credential, no state access. The backend
      # is a partial block, so this is also the only way to init without one.
      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: Upload generated provider lock file
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-lock
          path: infrastructure/terraform/.terraform.lock.hcl
          # .terraform.lock.hcl is a dotfile and upload-artifact skips hidden
          # files by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # `terraform validate` does not evaluate variable values, so this runs
      # with no account id, no instance id and no credentials.
      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate -no-color

      - name: Report AWS plan status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Terraform validate passed'
            if [ -z "${DEPLOY_ROLE:-}" ]; then
              echo ''
              echo 'AWS plan skipped: AWS_DEPLOY_ROLE_ARN is not configured, so'
              echo 'no AWS credential was requested and no AWS API call was made.'
            else
              echo ''
              echo 'A deploy role is configured. Run this workflow via'
              echo 'workflow_dispatch on main to produce an AWS plan.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${DEPLOY_ROLE:-}" ]; then
            echo "::notice::AWS plan skipped - deployment bootstrap not configured. fmt/init/validate passed."
          fi
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

  # ---------------------------------------------------------------------------
  # JOB 2 — the real plan. Manual, main-only, environment-bound.
  # ---------------------------------------------------------------------------
  plan:
    name: plan against AWS
    needs: validate
    # Manual dispatch on main only, and only once a deploy role exists. On a
    # pull request this job is skipped entirely, so PR code never reaches AWS.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The subject the deploy role's trust policy demands. Without this the
    # role cannot be assumed at all.
    environment:
      name: aws-qualification

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Enforce repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stockguard-plan-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      # Harmless smoke test: proves the environment-bound OIDC trust works
      # before anything reads state. Identity is never printed.
      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text > /dev/null
          echo "::notice::OIDC role assumed successfully."

      # Backend values are supplied here, never committed.
      - name: Terraform init with remote state
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform plan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_connect_instance_id: ${{ secrets.AWS_CONNECT_INSTANCE_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          # Both default to false. A plan never arms anything by itself, and
          # the operator must consciously flip these on dispatch.
          TF_VAR_simulator_enabled: ${{ inputs.simulator_enabled }}
          TF_VAR_enable_call_recording: ${{ inputs.enable_call_recording }}
        run: |
          set -euo pipefail
          terraform plan -no-color -out=tfplan | tee plan.txt

      - name: Summarize plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Terraform plan'
            echo ''
            echo "simulator_enabled: \`${{ inputs.simulator_enabled }}\`"
            echo "enable_call_recording: \`${{ inputs.enable_call_recording }}\`"
            echo ''
            echo '```'
            # Counts only. A full plan echoes ARNs and the contact-flow body,
            # so it stays in the job log rather than the summary.
            grep -E '^(Plan:|No changes)' infrastructure/terraform/plan.txt || echo 'see job log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
