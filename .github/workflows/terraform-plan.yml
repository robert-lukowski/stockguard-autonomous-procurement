name: Terraform Plan

run-name: Terraform plan · ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      simulator_enabled:
        description: 'Keep the synthetic supplier armed in the reviewed plan'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Enforce repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: Upload generated provider lock file
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-lock
          path: infrastructure/terraform/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate -no-color

      - name: Report AWS plan status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Terraform validate passed'
            if [ -z "${DEPLOY_ROLE:-}" ]; then
              echo ''
              echo 'AWS plan skipped: AWS_DEPLOY_ROLE_ARN is not configured.'
            else
              echo ''
              echo 'Run this workflow manually on main to produce an AWS plan.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

  plan:
    name: plan against AWS
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: aws-qualification

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Enforce repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = "1341560793"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "207513888"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stockguard-plan-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text > /dev/null
          echo "::notice::OIDC role assumed successfully."

      - name: Terraform init with remote state
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        env:
          TF_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform plan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_connect_instance_id: ${{ secrets.AWS_CONNECT_INSTANCE_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_simulator_enabled: ${{ inputs.simulator_enabled }}
        run: |
          set -euo pipefail
          terraform plan -no-color -out=tfplan | tee plan.txt

      - name: Summarize the plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Terraform plan'
            echo ''
            echo "simulator_enabled: \`${{ inputs.simulator_enabled }}\`"
            echo ''
            echo '```'
            grep -E '^(Plan:|No changes)' infrastructure/terraform/plan.txt || echo 'see job log'
            echo '```'
            echo ''
            echo 'Review the full plan in the job log before running Terraform Apply.'
          } >> "$GITHUB_STEP_SUMMARY"
